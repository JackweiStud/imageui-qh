<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B0E0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="400" fill="url(#skyMountain)"/>
  <!-- Sun -->
  <circle cx="500" cy="60" r="35" fill="#FFD700"/>
  <!-- Mountains -->
  <path d="M 0 400 L 150 200 L 300 280 L 450 150 L 600 250 L 600 400 Z" fill="#E6E6FA" stroke="#C0C0C0" stroke-width="2"/>
  <!-- Snow peaks -->
  <path d="M 150 200 L 180 180 L 210 200" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <path d="M 450 150 L 480 130 L 510 150" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Snow on mountains -->
  <path d="M 0 400 L 150 200 L 300 280 L 0 400" fill="#F0F8FF"/>
  <path d="M 300 280 L 450 150 L 600 250 L 600 400 L 300 400 Z" fill="#F0F8FF"/>
  <!-- Clouds -->
  <ellipse cx="100" cy="80" rx="40" ry="20" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="350" cy="100" rx="35" ry="18" fill="#FFFFFF" opacity="0.8"/>
  <!-- Text -->
  <text x="300" y="360" font-family="Arial" font-size="22" fill="#4682B4" text-anchor="middle" font-weight="bold">Snow Mountain Summit</text>
</svg>

